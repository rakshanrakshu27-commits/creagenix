<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Hub</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --background: #f8fafc;
            --text: #1e293b;
            --card: #ffffff;
            --accent: #8b5cf6;
            --premium-color: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            line-height: 1.6;
        }
        .container {
            max-width: 550px;
            margin: 0 auto 40px auto;
        }
        header {
            text-align: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        header p { margin: 8px 0 0 0; opacity: 0.9; font-size: 15px; }
        
        .grade-section { margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-left: 5px; color: #475569; }
        .grade-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .grade-btn {
            background: var(--card);
            border: 1px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }
        .grade-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .content-panel {
            background: var(--card);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .panel-heading { font-size: 20px; margin: 0 0 18px 0; color: var(--text); font-weight: 700; }
        .resource-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .resource-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
        }
        .resource-card span.badge {
            background: var(--secondary);
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
        }
        .resource-card.sample span.badge { background: #f59e0b; }
        
        /* Premium locked/unlocked cards styles */
        .resource-card.premium-locked {
            opacity: 0.6;
            background: #f1f5f9;
            cursor: not-allowed;
        }
        .resource-card.premium-locked span.badge {
            background: #64748b;
        }

        /* Premium Box Styles */
        .premium-panel {
            background: linear-gradient(135deg, #fffbeb, #fff7ed);
            border: 2px dashed var(--premium-color);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.1);
            margin-bottom: 30px;
            position: relative;
        }
        .premium-badge-top {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--premium-color);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .premium-features {
            padding-left: 20px;
            margin: 15px 0;
            font-size: 14px;
        }
        .premium-features li {
            margin-bottom: 8px;
        }
        .pay-now-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #d97706, var(--premium-color));
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .pay-now-btn.unlocked {
            background: #10b981;
            cursor: default;
        }

        /* POPUP MODAL WINDOW FOR UPI SCANNING */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: #f1f5f9; border: none;
            border-radius: 50%; width: 30px; height: 30px;
            font-weight: bold; cursor: pointer;
        }
        .qr-placeholder {
            width: 180px;
            height: 180px;
            margin: 15px auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payment-input {
            width: 100%; padding: 12px; margin: 15px 0 10px 0;
            border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 14px; text-align: center; box-sizing: border-box;
        }

        .fact-feed { display: flex; flex-direction: column; gap: 15px; margin-bottom: 35px; }
        .feed-item {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
        }
        .feed-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .feed-item h4 { margin: 0 0 6px 0; font-size: 15px; color: var(--text); }
        .feed-item p { margin: 0; font-size: 13.5px; color: #475569; }

        .top-team-box {
            background: var(--card);
            border-radius: 16px;
            padding: 20px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .team-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .team-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .member-row {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f5f9;
        }
        .member-name { font-weight: 700; color: #1e293b; font-size: 13.5px; }
        .member-role {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 5px;
        }
        .role-founder { background: #dbeafe; color: #1e40af; }
        .role-cofounder { background: #d1fae5; color: #065f46; }
        .role-marketing { background: #fef3c7; color: #92400e; }

        footer {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>

            <h1>Smart Study Hub</h1>
            <p>Your Ultimate Interactive Learning Network</p>
        </header>

                <button class="grade-btn" onclick="switchGrade(this, 'Grade 12')">Grade 12</button>
            </div>
