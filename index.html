            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Hub</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --background: #f8fafc;
            --text: #1e293b;
            --card: #ffffff;
            --accent: #8b5cf6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            line-height: 1.6;
        }
        .container {
            max-width: 550px;
            margin: 0 auto 40px auto;
        }
        header {
            text-align: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        header p { margin: 8px 0 0 0; opacity: 0.9; font-size: 15px; }
        
        /* Stats Dashboard Panel */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        .stat-card {
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        .stat-num { font-size: 18px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; }

        /* Dynamic Grade Chooser Section */
        .grade-section { margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-left: 5px; color: #475569; }
        .grade-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none; /* Hide scrollbar for clean look */
        }
        .grade-tabs::-webkit-scrollbar { display: none; }
        .grade-btn {
            background: var(--card);
            border: 1px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .grade-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Material Content Display Panel */
        .content-panel {
            background: var(--card);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid #f1f5f9;
        }
        .panel-heading { font-size: 20px; margin: 0 0 18px 0; color: var(--text); font-weight: 700; }
        .resource-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .resource-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 15px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .resource-card:active { transform: scale(0.98); background: #f1f5f9; }
        .resource-card span.badge {
            background: var(--secondary);
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .resource-card.sample span.badge { background: #f59e0b; }

        /* Massive Interactive Trivia Hub (High Scrolling Retention) */
        .trivia-hub {
            background: linear-gradient(135deg, #ffffff, #f5f3ff);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid #e9e3ff;
        }
        .trivia-heading { font-size: 18px; margin: 0 0 15px 0; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .live-fact-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            font-size: 14px;
            font-weight: 500;
            color: #4c1d95;
            margin-bottom: 15px;
        }
        .gen-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(139, 92, 246, 0.2);
        }

        /* Scrollable Infinite Feed Section */
        .fact-feed { display: flex; flex-direction: column; gap: 15px; margin-bottom: 35px; }
        .feed-item {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
        }
        .feed-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .feed-item h4 { margin: 0 0 6px 0; font-size: 15px; color: var(--text); font-weight: 700; }
        .feed-item p { margin: 0; font-size: 13.5px; color: #475569; }

        /* Leadership Footer Cards */
        footer {
            background: var(--card);
            border-radius: 16px;
            padding: 24px 15px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .team-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1.5px;
        }
        .team-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .member-row {
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f5f9;
        }
        .member-name { font-weight: 700; color: #1e293b; font-size: 14px; }
        .member-role {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .role-founder { background: #dbeafe; color: #1e40af; }
        .role-cofounder { background: #d1fae5; color: #065f46; }
        .role-marketing { background: #fef3c7; color: #92400e; }
        
        .copyright {
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin: 0;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Banner -->
        <header>
            <h1>Smart Study Hub</h1>
            <p>Your Ultimate Interactive Learning Network</p>
        </header>

        <!-- Stats Bar Overview -->
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-num">7+</div><div class="stat-label">Grades</div></div>
            <div class="stat-card"><div class="stat-num">500+</div><div class="stat-label">MCQs</div></div>
            <div class="stat-card"><div class="stat-num">100%</div><div class="stat-label">Free</div></div>
        </div>

        <!-- Grade Selector Strip (Including Grades 6,7,8,9,10,11,12) -->
        <div class="grade-section">
            <div class="section-title">Select Your Academic Grade:</div>
            <div class="grade-tabs">
                <button class="grade-btn active" onclick="switchGrade('Grade 6')">Grade 6</button>
                <button class="grade-btn" onclick="switchGrade('Grade 7')">Grade 7</button>
                <button class="grade-btn" onclick="switchGrade('Grade 8')">Grade 8</button>
                <button class="grade-btn" onclick="switchGrade('Grade 9')">Grade 9</button>
                <button class="grade-btn" onclick="switchGrade('Grade 10')">Grade 10</button>
                <button class="grade-btn" onclick="switchGrade('Grade 11')">Grade 11</button>
                <button class="grade-btn" onclick="switchGrade('Grade 12')">Grade 12</button>
            </div>
        </div>

        <!-- Material Resource Window -->
        <div class="content-panel">
            <h2 id="current-grade-title" class="panel-heading">Grade 6 Resources</h2>
            <div class="resource-options">
                <a href="#" class="resource-card" onclick="alert('MCQ Practice test database loading...')">
                    <span>📝 Launch Interactive MCQ Test</span>
                    <span class="badge">Quiz Portal</span>
    </a>
